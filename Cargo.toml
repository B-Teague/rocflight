[package]
name = "rocflight"
version = "0.1.0"
edition = "2021"

[dependencies]
bumpalo = "3.14"
once_cell = "1.19"
regex = "1.10"
thiserror = "1.0"

# Platform loading (Phase 16)
reqwest = { version = "0.11", features = ["stream"] }
brotli = "3.3"
tar = "0.4"
sha2 = "0.10"

# Release: the interpreter is one binary doing one job, so trade build time for it.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# The gates run the DEBUG binary, and an unoptimised tree-walker is 3-5x slower than a
# release one. `opt-level = 1` keeps debug builds quick to produce while making the
# test loop noticeably faster to run; dependencies are built once, so they get the lot.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3


[[bin]]
name = "rocflight"
path = "src/main.rs"

[lib]
name = "rocflight"
path = "src/lib.rs"
