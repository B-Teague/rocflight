[package]
name = "rocflight"
version = "0.1.0"
edition = "2021"

[dependencies]
once_cell = "1.19"
# roc's F64 transcendentals are musl's (via zig), which is what this crate ports.
libm = "0.2"

# `host/` is the platform-side half: the same interpreter built as a static library
# that a platform's compiled host links against and calls `roc_main` on. It is not
# built by default; `tests/check_host.sh` builds it for musl. See Learning.md §13.
[workspace]
members = ["host"]

# Release: the interpreter is one binary doing one job, so trade build time for it.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The gates run the DEBUG binary, and an unoptimised tree-walker is 3-5x slower than a
# release one. `opt-level = 1` keeps debug builds quick to produce while making the
# test loop noticeably faster to run; dependencies are built once, so they get the lot.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3


[[bin]]
name = "rocflight"
path = "src/main.rs"

[lib]
name = "rocflight"
path = "src/lib.rs"
